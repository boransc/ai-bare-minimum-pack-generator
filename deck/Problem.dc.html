<x-dc>
<helmet>

    body { margin: 0; }

</helmet>
<div style="width: 1600px; height: 900px; background: #f6f5f0; color: #172724; font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; display: flex; flex-direction: column; justify-content: space-between; padding: 104px 120px;">

  <div style="font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; font-size: 26px; color: #43534e;">
    A real result from testing the live product:
  </div>

  <div style="display: flex; align-items: flex-start; gap: 88px;">

    <div style="display: flex; flex-direction: column;">
      <div style="font-weight: 500; font-size: 250px; line-height: 0.86; letter-spacing: -0.055em; color: #172724;">6<span style="color: #61706b;">/8</span></div>
      <div style="font-family: 'DM Mono', ui-monospace, Consolas, monospace; font-size: 14px; letter-spacing: 0.13em; text-transform: uppercase; color: #61706b; margin-top: 26px;">Points evidenced</div>
    </div>

    <div style="flex-grow: 1; padding-top: 18px; border-left: 1px solid #d5ddd9; padding-left: 88px; display: flex; flex-direction: column; gap: 34px;">

  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-style: italic; color: #172724;">
      A score that flatters you is worse than no score at all.
    </div>
    <div style="font-family: 'DM Mono', ui-monospace, Consolas, monospace; font-size: 13px; letter-spacing: 0.13em; color: #61706b;">02 / 05</div>
  </div>

</div>
